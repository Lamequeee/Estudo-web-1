<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 6</title>
    <style>
        *{
            margin: 0;
        }
        div{
            width: 150px;
            height: 150px;
        }

        #box1{
            background-color: red;
        }
        #box2{
            position: absolute;
            top: 0;
            right: 0;
            background-color: yellow;
        }

         #box3{
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: blue;
        }

         #box4{
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: green;
        }

         #box5{
            position: absolute;
           top: 50%;
           right: 50%;
           transform: translate(+50%, -50%);
            background-color: fuchsia;
        }
    </style>
</head>
<body>
    <div id="box1">1</div>
    <div id="box2">2</div>
    <div id="box3">3</div>
    <div id="box4">4</div>
    <div id="box5">5</div>
</body>
</html>
