<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação de Barquinho</title>
    <style>
        body{
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom, white, rgb(53, 148, 238));
           overflow-x: hidden;
        }

        #Nuvem{
        position: relative;
           width: 200px;
           height: 100px;
           border-radius: 50% ;
           background-color: white; 
           box-shadow: 1px 1px rgba(143, 142, 142, 0.897);
           animation: voar 20s linear infinite;          
        }

        .Nuvem2{
            position: relative;
           width: 130px;
           height: 85px;
           border-radius: 50% ;
           background-color: white; 
           box-shadow: 1px 1px rgba(143, 142, 142, 0.897);
           z-index: 1;
           top: 30px;
           left: 100px;
        }


        .mar{
            position: relative;
            background-color: blue;
            width: 100%;
            height: 200px;
            top: 337px;
        }

        @keyframes voar{
            0% {left: 0px}
            100%{left: 100vw}
        }

        .barco{
            position: absolute;
            font-size: 200px;
            left: 40%;
            bottom: 70%;
            animation: navegar 10s infinite;
        }

        @keyframes navegar{
            0%{transform: translateX(0px);}
             50%{transform: translate(100px);}
             100%{transform: translateX(0px);}
        }
    </style>
</head>
    <div id="Container">
        <div id="Nuvem">
            <div class="Nuvem2">

            </div>
        </div>

        
        <div class="mar">
            <div class="barco">⛵</div>
        </div>
    </div>
</body>
</html>
