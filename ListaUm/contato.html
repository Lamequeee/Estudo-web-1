<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário para Contato</h1>
    <p>Digite sua mensagem para o destinatário.</p>
    <hr>
    <form action="" method="get">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
<br> 
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required="required" placeholder="exemplo@exemplo.com">
<br>
        <label for="Assunto">Assunto:</label>
        <input type="text" name="Assunto" id="Assunto" placeholder="Assunto do Email">
<br>
        <label for="Estados">Estado</label>
        <select name="Estado" id="Estado">
            <option value="SC">SC</option>
            <option value="BH">BH</option>
            <option value="PR">PR</option>
        </select>
<br>        
        <label for="Mensagem">Mensagem</label>
        <input type="text" id="Mensagem" name="Mensagem" placeholder="Digite sua Mensagem">
<br>
        <input type="submit" id="Value" value="Enviar">
    </form>
    <hr>

    <h2>Vá para o Curriculo.</h2>
    <a href="curriculo.html">Curriculo</a>
</body>
</html>
