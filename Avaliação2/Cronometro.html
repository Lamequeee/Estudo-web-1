<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
    <style>
        *{
            margin: 0;
        }
       #container{
            display: flex;
            justify-content: space-between;
            background-color: gray;
            height: 100vh;
        }

        #esquerdo{
            flex: 1;
            position: relative;
        }
        
       #direito{
        position: relative;
        top: 63px;
            width: 80vh;
            height: 90vh;
            background-color: rgb(206, 200, 200);
            border-top-left-radius: 10px;
            display: flex;
            flex-direction: column;
}

        #direito>h1{
            align-self: flex-start;
        }

        #contagem{
            position: absolute;
            top: 40%;
            left: 20%; 
            font-size: 5em;
        }

    </style>
</head>
<body>
    <div id="container">
        <div id="esquerdo">
            <div>
                <p id="contagem">00:00:00</p>
            </div>
            <button id="iniciar">Iniciar</button>
            <button id="zerar">Zerar</button>
            <button id="pausar">Pausar</button>
        </div>

        <div id="direito">
            <h1>Paradas</h1>
            <div id="paradas">

            </div>
        </div>
    </div>

    <script>
        let temp = JSON.parse(localStorage.getItem('temp')) || [];

        const contagem = document.getElementById("contagem");
        const iniciar = document.getElementById("iniciar");
        const pausar = document.getElementById("pausar");
        const zerar = document.getElementById("zerar");
        let intervalo;

        function mostrarTempos(){
            const barralateral = document.getElementById('paradas');
            barralateral.innerHTML = '';
            temp.forEach(function(n){
                const div = document.createElement('div');
                div.innerText = n.contagem;   
                barralateral.appendChild(div);
            });
        }

        function atualizarHora(){
            const data = new Date();
            const horas = data.getHours().toString();
            const minutos = data.getMinutes().toString();
            const segundos = data.getSeconds().toString();
            const milissegundos = data.getMilliseconds().toString();
            contagem.innerHTML= `${horas}:${minutos}:${segundos}`;
        }

       

        iniciar.addEventListener("click", ()=>{
            intervalo=setInterval(atualizarHora, 1000);
       });

        pausar.addEventListener("click", ()=>{
           clearInterval(intervalo);
        });

            zerar.addEventListener("click", ()=>{
            contagem.innerText = "00:00:00";
        });

        function salvartempo() {
            const contagem = document.getElementById('contagem').innerText;
            temp.push({
            contagem: contagem
            });
            localStorage.setItem("temp", JSON.stringify(temp));
            mostrarTempos();
        }        

    document.getElementById("pausar").onclick = salvartempo

    </script>
</body>
</html>
