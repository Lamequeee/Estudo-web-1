<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4</title>
</head>
<body>
    <h1>Sorteio de Números</h1>
    
    <label for="min">Minimo</label>
     <input type="number" name="min" id="min">
     <label for="max">Maximo</label>
    <input type="number" name="max" id="max">
    <br>
    <button id="Sorteio">Sortear</button>
    <p id="Resultado"></p>
    <p id="quantidade"></p>

    <script>
        const Resultado = document.getElementById("Resultado");
        const Sorteio = document.getElementById("Sorteio");
        const quantidade = document.getElementById("quantidade");

     let num = {};

        Sorteio.addEventListener("click", ()=> {
        const min = Number(document.getElementById("min").value);
        const max = Number(document.getElementById("max").value);

        const calc = Math.floor(Math.random()*(max-min)+min);

        Resultado.innerText = calc.toFixed(0);

       
        if(num[calc]){
            num[calc]++;
        }else {
            num[calc] = 1;
        }
        
        let texto = "";

        for (let numero in num){
        texto += `${numero}: ${num[numero]}<br>`;
    }

        quantidade.innerHTML = texto;

        });
        
    </script>
</body>
</html>
