<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de IMC</title>
</head>
<body>
<h1>IMC</h1>

    <label for="nome">Nome</label>
    <input type="text" name="nome" id="nome">
    
    <label for="Peso">Peso(KG)</label>
    <input type="number" name="Peso" id="peso">

    <label for="altura">Altura(M)</label>
    <input type="number" name="altura" id="altura">

    <button>Calcular</button>

    <p id="resultadoIMC"></p>
    <p id="classificacao"></p>
    <img src="img/perfil.jpg" id="perfil">
    
    <script>
        const pesoInput = document.getElementById("peso");
        const alturaInput = document.getElementById("altura");
        const resultadoIMC = document.getElementById("resultadoIMC");
        const classificacao = document.getElementById("classificacao");
        const button = document.querySelector("button");

        let resultado=document.createElement("img");

        function calcularIMC(peso, altura){
            return peso / (altura * altura);
        }

        const perfil = document.getElementById("perfil");

        button.addEventListener("click", ()=>{
            const peso = parseFloat(pesoInput.value);
            const altura = parseFloat(alturaInput.value);

             const calc = calcularIMC(peso, altura);
             const faixa = Math.floor(calc);
             
             resultadoIMC.innerText = "IMC: " + calc.toFixed(2);

        if (calc < 18.5) {
            classificacao.innerText = "Abaixo do peso";
        }
        else if (calc < 25) {
            classificacao.innerText = "Peso normal";
        }
        else if (calc < 30) {
            classificacao.innerText = "Sobrepeso";
        }
        else if (calc < 35) {
            classificacao.innerText = "Obesidade Grau I";
        }
        else if (calc < 40) {
            classificacao.innerText = "Obesidade Grau II";
        }
        else {
            classificacao.innerText = "Obesidade Grau III";
        }

              switch (true) {
    case calc < 18.5:
        perfil.src = "img/abaixopeso.png";
        break;

    case calc < 25:
        perfil.src = "img/normal.png";
        break;

    case calc < 30:
        perfil.src = "img/sobrepeso.png";
        break;

    case calc < 35:
        perfil.src = "img/obesidade1.png";
        break;

    case calc < 40:
        perfil.src = "img/obesidade2.png";
        break;

    default:
        perfil.src = "img/  obesidade3.png";
}
        });

       
   
        

        

    </script>
</body>
</html>
